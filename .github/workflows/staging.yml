name: Publish branch preview to staging
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional source branch or commit; blank uses staging-source.txt'
        required: false
        type: string
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read
concurrency:
  group: staging-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      JEKYLL_ENV: staging
    steps:
      - name: Read preview selection
        uses: actions/checkout@v4
        with:
          path: staging-control
          persist-credentials: false
      - name: Select source branch or commit
        env:
          REQUESTED_REF: ${{ inputs.source_ref }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          selected = os.environ.get("REQUESTED_REF", "").strip() or Path("staging-control/staging-source.txt").read_text().strip()
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]{0,199}", selected):
              raise SystemExit("Invalid source ref")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"SOURCE_REF={selected}\n")
          PYTHON
      - name: Check out selected source
        uses: actions/checkout@v4
        with:
          repository: johnapaz/johnapaz.github.io
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - name: Record source revision
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler: '2.4.22'
          bundler-cache: true
      - name: Install dependencies
        run: |
          bundle install
      - name: Build staging
        run: |
          bundle exec jekyll build --safe --config _config.yml,_config.staging.yml
          printf 'staging.johnapaz.com\n' > _site/CNAME
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path("_site/build-info.json").write_text(json.dumps({"branch": os.environ["SOURCE_REF"], "commit": os.environ["SOURCE_SHA"], "run": os.environ["GITHUB_RUN_ID"]}) + "\n")
          PYTHON
          python3 scripts/check-staging.py
      - uses: actions/upload-artifact@v4
        with:
          name: staging-site
          path: _site
          include-hidden-files: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish staging Pages
        id: deployment
        uses: actions/deploy-pages@v4
